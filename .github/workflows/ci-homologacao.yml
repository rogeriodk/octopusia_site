name: Homologacao Pipeline

on:
  push:
    branches: [homologacao]
  pull_request:
    branches: [homologacao]

permissions:
  contents: read
  actions: read

concurrency:
  group: homologacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund

      - id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - id: unit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm test

      - id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          GIT_SHA: ${{ github.sha }}
          APP_ENV: homologacao
        run: npm run build

      - id: security
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          GIT_SHA: ${{ github.sha }}
        run: npm run security:check

      - id: docker
        if: steps.install.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t octopusia-site:${{ github.sha }} .

      - name: Generate sanitized CI report
        if: always()
        env:
          GIT_SHA: ${{ github.sha }}
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_TYPECHECK: ${{ steps.typecheck.outcome }}
          STEP_LINT: ${{ steps.lint.outcome }}
          STEP_UNIT: ${{ steps.unit.outcome }}
          STEP_BUILD: ${{ steps.build.outcome }}
          STEP_SECURITY: ${{ steps.security.outcome }}
          STEP_DOCKER: ${{ steps.docker.outcome }}
        run: node scripts/ci-report.mjs

      - name: Upload sanitized CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-ci-report
          path: runtime-reports/latest-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce CI gate
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.unit.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.security.outcome }}" = "success"
          test "${{ steps.docker.outcome }}" = "success"

  publish_ci_report:
    if: ${{ always() && github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download CI diagnostics
        uses: actions/download-artifact@v4
        with:
          name: homologacao-ci-report
          path: runtime-reports

      - name: Checkout report branch
        uses: actions/checkout@v4
        with:
          ref: homologacao-reports
          path: report-branch

      - name: Publish sanitized CI diagnostics
        run: |
          test -f runtime-reports/latest-ci.json
          mkdir -p report-branch/reports/history
          STAMP="$(date -u +'%Y%m%dT%H%M%SZ')"
          for F in runtime-reports/latest-ci.json runtime-reports/latest-security.json; do
            if [ -f "$F" ]; then
              NAME="$(basename "$F")"
              KIND="${NAME#latest-}"
              KIND="${KIND%.json}"
              cp "$F" "report-branch/reports/$NAME"
              cp "$F" "report-branch/reports/history/${STAMP}-${KIND}.json"
            fi
          done
          cd report-branch
          git config user.name "octopus-homologacao-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          if ! git diff --cached --quiet; then
            git commit -m "reports: ci ${{ github.sha }}"
            git push origin homologacao-reports
          fi

  deploy_test_report:
    if: ${{ github.event_name == 'push' && needs.validate.result == 'success' && needs.publish_ci_report.result == 'success' }}
    needs: [validate, publish_ci_report]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      EXPECTED_GIT_SHA: ${{ github.sha }}
      HOMOLOG_BASE_URL: ${{ vars.HOMOLOG_BASE_URL || secrets.HOMOLOG_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - id: config
        name: Validate deployment configuration
        continue-on-error: true
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_URL" ]; then
            echo "::error::Secret EASYPANEL_DEPLOY_URL não configurado."
            exit 1
          fi
          if [ -z "$HOMOLOG_BASE_URL" ]; then
            echo "::error::Variable ou Secret HOMOLOG_BASE_URL não configurado."
            exit 1
          fi

      - id: trigger
        name: Trigger EasyPanel deployment
        if: steps.config.outcome == 'success'
        continue-on-error: true
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: curl --fail --silent --show-error --request POST "$EASYPANEL_DEPLOY_URL" --output /dev/null

      - id: health
        name: Wait for exact revision
        if: steps.trigger.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p runtime-reports
          OBS="runtime-reports/health-observation.json"
          jq -n '{attempts:0,httpCode:"",reachable:false,ok:false,service:"",commit:""}' > "$OBS"
          for attempt in $(seq 1 36); do
            BODY_FILE="$(mktemp)"
            HTTP_CODE="$(curl --silent --show-error --max-time 8 -o "$BODY_FILE" -w '%{http_code}' "$HOMOLOG_BASE_URL/health" || true)"
            OK="false"
            SERVICE=""
            COMMIT=""
            if [ -s "$BODY_FILE" ]; then
              OK="$(jq -r '.ok // false' "$BODY_FILE" 2>/dev/null || echo false)"
              SERVICE="$(jq -r '.service // ""' "$BODY_FILE" 2>/dev/null || true)"
              COMMIT="$(jq -r '.commit // ""' "$BODY_FILE" 2>/dev/null || true)"
            fi
            REACHABLE="false"
            case "$HTTP_CODE" in 2??) REACHABLE="true" ;; esac
            jq -n \
              --argjson attempts "$attempt" \
              --arg httpCode "$HTTP_CODE" \
              --arg reachable "$REACHABLE" \
              --arg ok "$OK" \
              --arg service "$SERVICE" \
              --arg commit "$COMMIT" \
              '{attempts:$attempts,httpCode:$httpCode,reachable:($reachable=="true"),ok:($ok=="true"),service:$service,commit:$commit}' > "$OBS"
            rm -f "$BODY_FILE"
            if [ "$OK" = "true" ] && [ "$SERVICE" = "octopus-ia-site" ] && [ "$COMMIT" = "$EXPECTED_GIT_SHA" ]; then
              echo "Revision confirmed healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::A revisão esperada não ficou saudável dentro do prazo."
          exit 1

      - id: smoke
        name: Smoke tests
        if: steps.health.outcome == 'success'
        continue-on-error: true
        run: node scripts/smoke.mjs

      - id: ai_live
        name: Live AI backend test
        if: steps.health.outcome == 'success'
        continue-on-error: true
        run: node scripts/ai-live.mjs

      - id: ui_setup
        name: Prepare browser tests
        if: steps.health.outcome == 'success'
        continue-on-error: true
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - id: ui_live
        name: Desktop and mobile live UI tests
        if: steps.health.outcome == 'success' && steps.ui_setup.outcome == 'success'
        continue-on-error: true
        run: node scripts/ui-live.mjs

      - id: regression
        name: Regression tests
        if: steps.health.outcome == 'success'
        continue-on-error: true
        run: node scripts/regression.mjs

      - name: Upload UI failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-ui-evidence-${{ github.run_id }}
          path: runtime-reports/ui-failure-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate sanitized deployment report
        if: always()
        env:
          STEP_CONFIG: ${{ steps.config.outcome }}
          STEP_TRIGGER: ${{ steps.trigger.outcome }}
          STEP_HEALTH: ${{ steps.health.outcome }}
          STEP_SMOKE: ${{ steps.smoke.outcome }}
          STEP_AI_LIVE: ${{ steps.ai_live.outcome }}
          STEP_UI_SETUP: ${{ steps.ui_setup.outcome }}
          STEP_UI_LIVE: ${{ steps.ui_live.outcome }}
          STEP_REGRESSION: ${{ steps.regression.outcome }}
        run: node scripts/deploy-report.mjs

      - name: Checkout report branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: homologacao-reports
          path: report-branch

      - name: Publish sanitized deployment and functional reports
        if: always()
        run: |
          mkdir -p report-branch/reports/history
          STAMP="$(date -u +'%Y%m%dT%H%M%SZ')"
          for F in runtime-reports/latest-deploy.json runtime-reports/latest-smoke.json runtime-reports/latest-ai-live.json runtime-reports/latest-ui-live.json runtime-reports/latest-regression.json; do
            if [ -f "$F" ]; then
              NAME="$(basename "$F")"
              KIND="${NAME#latest-}"
              KIND="${KIND%.json}"
              cp "$F" "report-branch/reports/$NAME"
              cp "$F" "report-branch/reports/history/${STAMP}-${KIND}.json"
            fi
          done
          cd report-branch
          git config user.name "octopus-homologacao-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          if ! git diff --cached --quiet; then
            git commit -m "reports: deploy ${EXPECTED_GIT_SHA}"
            git pull --rebase origin homologacao-reports
            git push origin homologacao-reports
          fi

      - name: Enforce deploy, AI, UI and regression gate
        if: always()
        run: |
          test "${{ steps.config.outcome }}" = "success"
          test "${{ steps.trigger.outcome }}" = "success"
          test "${{ steps.health.outcome }}" = "success"
          test "${{ steps.smoke.outcome }}" = "success"
          test "${{ steps.ai_live.outcome }}" = "success"
          test "${{ steps.ui_setup.outcome }}" = "success"
          test "${{ steps.ui_live.outcome }}" = "success"
          test "${{ steps.regression.outcome }}" = "success"
